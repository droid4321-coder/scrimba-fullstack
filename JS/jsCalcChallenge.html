<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="jsCalcChallenge.css" />
</head>
<body>
    <div class="container">
        <div class="number1">
            <input type="number" id="number1">
        </div>
        <div class="operands">
            <button id="sum">Add</button>
            <button id="sub">Subtract</button>
            <button id="mul">Multiply</button>
            <button id="div">Divide</button>
        </div>
        <div class="number2">
            <input type="number" id="number2">
        </div>
        <div class="equal-sign">
            <p class="equals">=</p>
        </div>
        <div class="result">
            <p id="result"></p>
        </div>
    </div>
</body>
<script src="jsCalcChallenge.js"></script>
</html>
