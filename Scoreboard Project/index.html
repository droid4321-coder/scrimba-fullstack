<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="./src/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/seven-segment" rel="stylesheet">
                
</head>
<body>
    <div class="container">
        <div class="home-container">
            <div class="home">
                <h1 class="text" id="home-text">HOME</h1>
                <p class="score" id="home-score">0</p>
            </div>
            <div class="home-buttons">
                <button class="btn" id="home-add1">+1</button>
                <button class="btn" id="home-add2">+2</button>
                <button class="btn" id="home-add3">+3</button>
            </div>
        </div>
        <div class="guest-container">
            <div class="guest">
                <h1 class="text" id="guest-text">GUEST</h1>
                <p class="score" id="guest-score">0</p>
            </div>
            <div class="buttons">
                <button class="btn" id="guest-add1">+1</button>
                <button class="btn" id="guest-add2">+2</button>
                <button class="btn" id="guest-add3">+3</button>
            </div>
        </div>
    </div>
</body>
</html>
