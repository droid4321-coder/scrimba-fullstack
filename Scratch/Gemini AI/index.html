<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Programming Mentor</title>

    <style>
        /* Base styles */
        body {
            font-family: sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        #system-prompt {
            height: 120px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        #system-prompt-container {
            margin-top: 10px;
            margin-bottom: 10px;
        }

        #output-text {
            margin-top: 20px;
            padding: 15px;
            background: #f4f4f4;
            border-radius: 5px;
            white-space: pre-wrap;
        }

        /* The CSS loading dots animation */
        .is-loading::after {
            content: "";
            animation: loadingDots 1.5s steps(4) infinite;
        }

        @keyframes loadingDots {
            0% {
                content: "";
            }

            25% {
                content: ".";
            }

            50% {
                content: "..";
            }

            75% {
                content: "...";
            }

            100% {
                content: "";
            }
        }
    </style>
</head>

<body>

    <h1>AI Programming Mentor</h1>

    <textarea id="input-text" placeholder="Paste your code or ask your question here..."></textarea>

    <br>

    <button id="system-btn">System Instruction</button>

    <div id="system-prompt-container" hidden>
        <label for="system-prompt">
            <strong>Custom System Instruction</strong>
        </label>

        <textarea id="system-prompt"
            placeholder="Example: You are a patient programming mentor. Do not give me the complete solution unless I ask for it. Give me hints and explain the concepts..."></textarea>
    </div>

    <br>

    <button id="submit-btn">Get Hint</button>
    <button id="debug-btn">Send test to output (Debugging Purposes)</button>
    <button id="clear-btn">Clear Text</button>

    <div id="output-text">
        Your mentor's hints will appear here.
    </div>

    <script>
        const promptInput = document.getElementById("input-text");
        const systemPromptInput = document.getElementById("system-prompt");

        const systemBtn = document.getElementById("system-btn");
        const systemPromptContainer = document.getElementById("system-prompt-container");

        const output = document.getElementById("output-text");
        const submitBtn = document.getElementById("submit-btn");
        const debugBtn = document.getElementById("debug-btn");
        const clearBtn = document.getElementById("clear-btn");


        // Show/hide system instruction
        systemBtn.addEventListener("click", () => {
            systemPromptContainer.hidden = !systemPromptContainer.hidden;

            if (systemPromptContainer.hidden) {
                systemBtn.textContent = "System Instruction";
            } else {
                systemBtn.textContent = "Hide System Instruction";
            }
        });


        // Debug button
        debugBtn.addEventListener("click", () => {
            promptInput.value =
                "This is debug text for the input of the prompt";

            output.textContent =
                "This is debug text for the output of the AI prompt";
        });


        // Clear button
        clearBtn.addEventListener("click", () => {
            promptInput.value = "";
            systemPromptInput.value = "";
            output.textContent = "";
        });


        // Submit prompt
        submitBtn.addEventListener("click", async () => {

            const promptValue = promptInput.value;
            const systemPromptValue = systemPromptInput.value;

            if (!promptValue.trim()) return;

            // Loading state
            output.textContent = "Loading";
            output.classList.add("is-loading");

            try {

                const response = await fetch("/", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        userPrompt: promptValue,
                        systemPrompt: systemPromptValue
                    })
                });

                const data = await response.json();

                // Remove loading animation
                output.classList.remove("is-loading");

                if (data.error) {
                    output.textContent = data.error;
                } else {
                    output.textContent = data.mentorHint;
                }

            } catch (error) {

                output.classList.remove("is-loading");

                output.textContent =
                    "An error occurred connecting to the server.";

                console.error("Frontend Error:", error);
            }
        });
    </script>

</body>

</html>
