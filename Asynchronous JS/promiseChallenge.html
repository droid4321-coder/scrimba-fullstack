<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise Challenge</title>
</head>
<body>
    <div class="img-container" id="img-container"></div>
</body>
<script type="module">
    function preLoadImg(url){
        return new Promise((resolve, reject) => {
            const img = new Image();

            img.src = url;

            img.alt = "a scene"

            img.addEventListener("load", () => resolve(img));

            img.addEventListener("error", () => reject("img has NOT loaded"));


        });
    }

    try {
        const results = await preLoadImg("https://scrimba.ams3.cdn.digitaloceanspaces.com/assets/courses/gadvancedjs/scenic1.jpg")
        console.log(results);
        document.getElementById("img-container").appendChild(results);
    } catch(error) {
        console.error(error);
    }
</script>
</html>
