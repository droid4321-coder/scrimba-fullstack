<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="./src/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/seven-segment" rel="stylesheet">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />             
</head>
<body>
    <div class="container">
        <div class="home-container">
            <div class="home">
                <h1 class="text" id="home-text"></h1>
                <img src="./images/Boston_Celtics.svg.webp" alt="Home Team" class="image">
                <h2 class="score animate__animated animate__flash" id="home-score">0</h2>
            </div>
            <div class="buttons">
                <button class="btn" id="home-add1">+1</button>
                <button class="btn" id="home-add2">+2</button>
                <button class="btn" id="home-add3">+3</button>
            </div>
        </div>
        <div class="center-container">
            <p class="text">TIMER</p>
            <h2 class="score" id="timer"></h2>
            <button class="btn" id="pause-btn">Pause</button>
            <button class="btn" id="resume-btn">Resume</button>
            <button class="btn" id="reset-timer-btn">Reset Timer</button>
            <p class="text">PERIOD</p>
            <h2 class="score" id="period">1</h2>
            <button class="btn" id="reset-btn">Reset Score</button>
        </div>
        <div class="guest-container">
            <div class="guest">
                <h1 class="text" id="guest-text"></h1>
                <img src="./images/New_York_Knicks_logo.svg.webp" alt="Guest Team" class="image">
                <h2 class="score animate__animated animate__flash" id="guest-score">0</h2>
            </div>
            <div class="buttons">
                <button class="btn" id="guest-add1">+1</button>
                <button class="btn" id="guest-add2">+2</button>
                <button class="btn" id="guest-add3">+3</button>
            </div>
        </div>
    </div>
</body>
<script src="./src/script.js">
</script>
</html>
